<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JWST Scaffolds</title>
<style>
:root{--bg:#0b0d14;--panel:#141826;--line:#262d44;--tx:#e6e9f5;--mut:#98a2c3;--acc:#e8b84a}
@media (prefers-color-scheme:light){:root{--bg:#f3f4f8;--panel:#fff;--line:#cdd2e3;--tx:#161a2b;--mut:#566086;--acc:#9a6b00}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}header .mut{color:var(--mut)}
button,select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}button:focus-visible,select:focus-visible,li:focus-visible{outline:2px solid var(--acc)}
main{flex:1;display:flex;min-height:0}
nav{width:290px;overflow:auto;border-right:1px solid var(--line);padding:6px}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 8px 4px}
nav li{list-style:none;padding:5px 8px;border-radius:6px;cursor:pointer;word-break:break-all}nav li:hover{background:var(--panel)}nav li.sel{background:var(--panel);outline:1px solid var(--acc)}nav ul{margin:0;padding:0}
#view{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#panes{flex:1;display:flex;min-height:0;position:relative}
.pane{flex:1;position:relative;overflow:hidden;background:#000;cursor:grab;min-width:0}.pane+.pane{border-left:1px solid var(--line)}
.pane img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.cap{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;padding:3px 8px;border-radius:5px;font-size:12px;z-index:3;pointer-events:none}
#note{max-height:84px;overflow:auto;padding:6px 14px;border-top:1px solid var(--line);color:var(--mut);font:12px ui-monospace,monospace;white-space:pre-wrap}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#889;z-index:2}
body.blink #panes .pane:nth-child(2){position:absolute;inset:0;border:0}body.blink #panes .pane:nth-child(1){position:absolute;inset:0}
@media (max-width:820px){main{flex-direction:column}nav{width:auto;max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}#panes{flex-direction:column}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>JWST scaffolds: raw | false colour</h1><span class="mut" id="count"></span><span class="mut">Wheel = zoom, drag = pan (both panes together), double-click = fit. Keys: ←/→ item, B blink, F fit.</span></header>
<main><nav id="nav" aria-label="Scaffold list"></nav>
<section id="view"><div id="bar">
<label>Raw <select id="rawSel"></select></label><label>False colour <select id="falseSel"></select></label>
<button id="blinkBtn" aria-pressed="false">Blink (B)</button><button id="fitBtn">Fit (F)</button><button id="syncBtn" class="on" aria-pressed="true">Sync zoom</button><span class="mut" id="title"></span></div>
<div id="panes"><div class="pane" id="p1"><div class="cap" id="c1">raw</div><img id="i1" alt="raw image"></div><div class="pane" id="p2"><div class="cap" id="c2">false colour</div><img id="i2" alt="false-colour image"></div><div id="empty" hidden>no raw image paired</div></div>
<div id="note"></div></section></main>
<script>
const DATA=/*DATA*/;let cur=0,blinkOn=false,sync=true,blinkT=null;
const $=id=>document.getElementById(id),nav=$("nav");
const st=[{z:1,x:0,y:0},{z:1,x:0,y:0}];
function build(){const by={};DATA.forEach((d,i)=>(by[d.target]=by[d.target]||[]).push(i));
 for(const t in by){const h=document.createElement("h2");h.textContent=t.replace(/_/g," ");nav.appendChild(h);const ul=document.createElement("ul");
  by[t].forEach(i=>{const li=document.createElement("li");li.tabIndex=0;li.textContent=DATA[i].title;li.dataset.i=i;li.onclick=()=>show(i);li.onkeydown=e=>{if(e.key==="Enter")show(i)};ul.appendChild(li)});nav.appendChild(ul)}
 $("count").textContent=DATA.length+" scaffolds";}
function opts(sel,arr){sel.innerHTML="";arr.forEach((a,k)=>{const o=document.createElement("option");o.value=k;o.textContent=a[0];sel.appendChild(o)});sel.disabled=arr.length<2}
function show(i){cur=i;const d=DATA[i];[...nav.querySelectorAll("li")].forEach(l=>l.classList.toggle("sel",+l.dataset.i===i));
 opts($("rawSel"),d.raw);opts($("falseSel"),d.false);$("title").textContent=d.target+" · "+d.title;$("note").textContent=d.note||"";setImgs();
 const s=nav.querySelector("li.sel");if(s)s.scrollIntoView({block:"nearest"})}
function setImgs(){const d=DATA[cur],r=d.raw[+$("rawSel").value||0],f=d.false[+$("falseSel").value||0];
 $("empty").hidden=!!r;$("p1").style.visibility=r?"visible":"hidden";
 $("i1").src=r?r[1]:"";$("c1").textContent="raw: "+(r?r[0]:"none");$("i2").src=f[1];$("c2").textContent="false colour: "+f[0];
 const go=()=>fit();$("i2").onload=go;$("i1").onload=go;}
function fit(){[0,1].forEach(k=>{const p=$("p"+(k+1)),im=$("i"+(k+1));if(!im.naturalWidth)return;const z=Math.min(p.clientWidth/im.naturalWidth,p.clientHeight/im.naturalHeight);
 st[k]={z,x:(p.clientWidth-im.naturalWidth*z)/2,y:(p.clientHeight-im.naturalHeight*z)/2};apply(k)})}
function apply(k){const im=$("i"+(k+1)),s=st[k];im.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.z})`}
function wheel(k,e){e.preventDefault();const p=$("p"+(k+1)).getBoundingClientRect(),mx=e.clientX-p.left,my=e.clientY-p.top,f=e.deltaY<0?1.15:1/1.15,s=st[k];
 const nz=Math.max(.02,Math.min(40,s.z*f));s.x=mx-(mx-s.x)*nz/s.z;s.y=my-(my-s.y)*nz/s.z;s.z=nz;apply(k);
 if(sync){const o=1-k;st[o]={...s};apply(o)}}
function drag(k){const p=$("p"+(k+1));let on=false,lx,ly;p.onmousedown=e=>{on=true;lx=e.clientX;ly=e.clientY;p.style.cursor="grabbing"};
 window.addEventListener("mouseup",()=>{on=false;p.style.cursor="grab"});
 window.addEventListener("mousemove",e=>{if(!on)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;st[k].x+=dx;st[k].y+=dy;apply(k);if(sync){st[1-k]={...st[k]};apply(1-k)}});
 p.addEventListener("wheel",e=>wheel(k,e),{passive:false});p.ondblclick=fit}
function blink(){blinkOn=!blinkOn;document.body.classList.toggle("blink",blinkOn);$("blinkBtn").classList.toggle("on",blinkOn);$("blinkBtn").setAttribute("aria-pressed",blinkOn);
 clearInterval(blinkT);if(blinkOn){let a=false;blinkT=setInterval(()=>{a=!a;$("p2").style.visibility=a?"hidden":"visible"},700)}else{$("p2").style.visibility="visible"}setTimeout(fit,30)}
$("rawSel").onchange=setImgs;$("falseSel").onchange=setImgs;$("blinkBtn").onclick=blink;$("fitBtn").onclick=fit;
$("syncBtn").onclick=()=>{sync=!sync;$("syncBtn").classList.toggle("on",sync);$("syncBtn").setAttribute("aria-pressed",sync)};
addEventListener("keydown",e=>{if(/select|input/i.test(e.target.tagName))return;if(e.key==="ArrowRight")show(Math.min(DATA.length-1,cur+1));if(e.key==="ArrowLeft")show(Math.max(0,cur-1));if(e.key==="b"||e.key==="B")blink();if(e.key==="f"||e.key==="F")fit()});
addEventListener("resize",fit);build();drag(0);drag(1);show(0);
</script></body></html>
