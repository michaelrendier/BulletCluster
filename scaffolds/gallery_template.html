<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JWST Scaffolds</title>
<style>
:root{--bg:#0b0d14;--panel:#141826;--line:#262d44;--tx:#e6e9f5;--mut:#98a2c3;--acc:#e8b84a}
@media (prefers-color-scheme:light){:root{--bg:#f3f4f8;--panel:#fff;--line:#cdd2e3;--tx:#161a2b;--mut:#566086;--acc:#9a6b00}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}header .mut{color:var(--mut)}
button,select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}button:focus-visible,select:focus-visible,li:focus-visible{outline:2px solid var(--acc)}
main{flex:1;display:flex;min-height:0}
nav{width:290px;overflow:auto;border-right:1px solid var(--line);padding:6px}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 8px 4px}
nav li{list-style:none;padding:5px 8px;border-radius:6px;cursor:pointer;word-break:break-all}nav li:hover{background:var(--panel)}nav li.sel{background:var(--panel);outline:1px solid var(--acc)}nav ul{margin:0;padding:0}
#view{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#panes{flex:1;display:flex;min-height:0;position:relative}
.pane{flex:1;position:relative;overflow:hidden;background:#000;cursor:grab;min-width:0}.pane+.pane{border-left:1px solid var(--line)}
.pane img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.cap{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;padding:3px 8px;border-radius:5px;font-size:12px;z-index:3;pointer-events:none}
#note{max-height:84px;overflow:auto;padding:6px 14px;border-top:1px solid var(--line);color:var(--mut);font:12px ui-monospace,monospace;white-space:pre-wrap}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#889;z-index:2}
body.blink #panes .pane:nth-child(2){position:absolute;inset:0;border:0}body.blink #panes .pane:nth-child(1){position:absolute;inset:0}
@media (max-width:820px){main{flex-direction:column}nav{width:auto;max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}#panes{flex-direction:column}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
.ov{position:absolute;left:0;top:0;pointer-events:none;z-index:2}#ovctl{display:flex;gap:10px;align-items:center;padding-left:10px;border-left:1px solid var(--line)}#ovctl label{display:flex;gap:4px;align-items:center;cursor:pointer}#ovctl input[type=range]{width:90px}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #000}#ovctl[hidden],#empty[hidden],#panes[hidden],#vw[hidden],#bar[hidden]{display:none}#vw{flex:1;border:0;width:100%;min-height:0;background:#000}</style></head><body>
<header><h1>JWST scaffolds: raw | false colour</h1><span class="mut" id="count"></span><span class="mut">Wheel = zoom, drag = pan (both panes together), double-click = fit. Keys: ←/→ item, B blink, F fit.</span></header>
<main><nav id="nav" aria-label="Scaffold list"></nav>
<section id="view"><div id="bar">
<label>Raw <select id="rawSel"></select></label><label>False colour <select id="falseSel"></select></label>
<button id="blinkBtn" aria-pressed="false">Blink (B)</button><button id="fitBtn">Fit (F)</button><button id="syncBtn" class="on" aria-pressed="true">Sync zoom</button><span id="ovctl" hidden><label><input type="checkbox" id="ovShear"><span class="sw" id="swS"></span>Shear (JWST)</label><label><input type="checkbox" id="ovPol"><span class="sw" id="swP"></span>Polarization (HST)</label><label><input type="checkbox" id="ovLines" checked>field lines</label><label>min SNR <input type="range" id="ovSnr" min="0" max="8" step="0.5" value="1"><span id="ovSnrV">1</span></label><label>length <input type="range" id="ovLen" min="0.3" max="2.5" step="0.1" value="1"></label></span><span class="mut" id="title"></span></div>
<div id="panes"><div class="pane" id="p1"><div class="cap" id="c1">raw</div><img id="i1" alt="raw image"><canvas class="ov" id="ov1"></canvas></div><div class="pane" id="p2"><div class="cap" id="c2">false colour</div><img id="i2" alt="false-colour image"><canvas class="ov" id="ov2"></canvas></div><div id="empty" hidden>no raw image paired</div></div>
<iframe id="vw" hidden title="zoomable field viewer"></iframe><div id="note"></div></section></main>
<script>
const DATA=/*DATA*/,OV=/*OVERLAYS*/,WCS=/*WCS*/;let cur=0,blinkOn=false,sync=true,blinkT=null;
const $=id=>document.getElementById(id),nav=$("nav");
const st=[{z:1,x:0,y:0},{z:1,x:0,y:0}];
function build(){const by={};DATA.forEach((d,i)=>(by[d.target]=by[d.target]||[]).push(i));
 for(const t in by){const h=document.createElement("h2");h.textContent=t.replace(/_/g," ");nav.appendChild(h);const ul=document.createElement("ul");
  by[t].forEach(i=>{const li=document.createElement("li");li.tabIndex=0;li.textContent=DATA[i].title;li.dataset.i=i;li.onclick=()=>show(i);li.onkeydown=e=>{if(e.key==="Enter")show(i)};ul.appendChild(li)});nav.appendChild(ul)}
 $("count").textContent=DATA.length+" scaffolds";}
function opts(sel,arr){sel.innerHTML="";arr.forEach((a,k)=>{const o=document.createElement("option");o.value=k;o.textContent=a[0];sel.appendChild(o)});sel.disabled=arr.length<2}
function show(i){cur=i;const d=DATA[i];const isV=!!d.viewer;$("panes").hidden=isV;$("bar").hidden=isV;$("vw").hidden=!isV;if(isV){[...nav.querySelectorAll("li")].forEach(l=>l.classList.toggle("sel",+l.dataset.i===i));$("title").textContent=d.target+" · "+d.title;$("note").textContent="Wheel = zoom, drag = pan, double-click = fit data, F = full image (inside the viewer). Use the sidebar to change item.";if($("vw").getAttribute("src")!==d.viewer)$("vw").src=d.viewer;const s=nav.querySelector("li.sel");if(s)s.scrollIntoView({block:"nearest"});return}
 [...nav.querySelectorAll("li")].forEach(l=>l.classList.toggle("sel",+l.dataset.i===i));
 opts($("rawSel"),d.raw);opts($("falseSel"),d.false);$("title").textContent=d.target+" · "+d.title;ovControls();$("note").textContent=d.note||"";setImgs();
 const s=nav.querySelector("li.sel");if(s)s.scrollIntoView({block:"nearest"})}
function setImgs(){const d=DATA[cur],r=d.raw[+$("rawSel").value||0],f=d.false[+$("falseSel").value||0];
 $("empty").hidden=!!r;$("p1").style.visibility=r?"visible":"hidden";
 $("i1").src=r?r[1]:"";$("c1").textContent="raw: "+(r?r[0]:"none");$("i2").src=f[1];$("c2").textContent="false colour: "+f[0];
 const go=()=>fit();$("i2").onload=go;$("i1").onload=go;}
function fit(){[0,1].forEach(k=>{const p=$("p"+(k+1)),im=$("i"+(k+1));if(!im.naturalWidth)return;const z=Math.min(p.clientWidth/im.naturalWidth,p.clientHeight/im.naturalHeight);
 st[k]={z,x:(p.clientWidth-im.naturalWidth*z)/2,y:(p.clientHeight-im.naturalHeight*z)/2};apply(k)})}
function apply(k){const im=$("i"+(k+1)),s=st[k];im.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.z})`;if(typeof drawOv==="function")drawOv(k)}
function wheel(k,e){e.preventDefault();const p=$("p"+(k+1)).getBoundingClientRect(),mx=e.clientX-p.left,my=e.clientY-p.top,f=e.deltaY<0?1.15:1/1.15,s=st[k];
 const nz=Math.max(.02,Math.min(40,s.z*f));s.x=mx-(mx-s.x)*nz/s.z;s.y=my-(my-s.y)*nz/s.z;s.z=nz;apply(k);
 if(sync){const o=1-k;st[o]={...s};apply(o)}}
function drag(k){const p=$("p"+(k+1));let on=false,lx,ly;p.onmousedown=e=>{on=true;lx=e.clientX;ly=e.clientY;p.style.cursor="grabbing"};
 window.addEventListener("mouseup",()=>{on=false;p.style.cursor="grab"});
 window.addEventListener("mousemove",e=>{if(!on)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;st[k].x+=dx;st[k].y+=dy;apply(k);if(sync){st[1-k]={...st[k]};apply(1-k)}});
 p.addEventListener("wheel",e=>wheel(k,e),{passive:false});p.ondblclick=fit}
function blink(){blinkOn=!blinkOn;document.body.classList.toggle("blink",blinkOn);$("blinkBtn").classList.toggle("on",blinkOn);$("blinkBtn").setAttribute("aria-pressed",blinkOn);
 clearInterval(blinkT);if(blinkOn){let a=false;blinkT=setInterval(()=>{a=!a;$("p2").style.visibility=a?"hidden":"visible"},700)}else{$("p2").style.visibility="visible"}setTimeout(fit,30)}
$("rawSel").onchange=setImgs;$("falseSel").onchange=setImgs;$("blinkBtn").onclick=blink;$("fitBtn").onclick=fit;
$("syncBtn").onclick=()=>{sync=!sync;$("syncBtn").classList.toggle("on",sync);$("syncBtn").setAttribute("aria-pressed",sync)};
addEventListener("keydown",e=>{if(/select|input/i.test(e.target.tagName))return;if(e.key==="ArrowRight")show(Math.min(DATA.length-1,cur+1));if(e.key==="ArrowLeft")show(Math.max(0,cur-1));if(e.key==="b"||e.key==="B")blink();if(e.key==="f"||e.key==="F")fit()});

function gnom(w,ra,dec){const r=Math.PI/180,r0=w.crval[0]*r,d0=w.crval[1]*r,a=ra*r,d=dec*r;
 const c=Math.sin(d0)*Math.sin(d)+Math.cos(d0)*Math.cos(d)*Math.cos(a-r0);
 const xi=Math.cos(d)*Math.sin(a-r0)/c/r,eta=(Math.cos(d0)*Math.sin(d)-Math.sin(d0)*Math.cos(d)*Math.cos(a-r0))/c/r;
 const [[A,B],[C,D]]=w.cd,det=A*D-B*C,dx=(D*xi-B*eta)/det,dy=(-C*xi+A*eta)/det,xa=w.crpix[0]-1+dx,ya=w.crpix[1]-1+dy;
 const sh=w.shift||[0,0];return [xa+sh[0],(w.flipud?w.H-1-ya:ya)+sh[1]]}
function drawOv(k){const cv=$("ov"+(k+1)),p=$("p"+(k+1)),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1,pw=p.clientWidth,ph=p.clientHeight;
 if(cv.width!==Math.round(pw*dpr)||cv.height!==Math.round(ph*dpr)){cv.width=Math.round(pw*dpr);cv.height=Math.round(ph*dpr);cv.style.width=pw+"px";cv.style.height=ph+"px"}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,pw,ph);
 const d=DATA[cur],ov=OV[d.target];if(!ov)return;const src=$("i"+(k+1)).getAttribute("src");const w=WCS[src];if(!w)return;
 const s=st[k],minSnr=+$("ovSnr").value,lenScale=+$("ovLen").value,lines=$("ovLines").checked;
 const arcpix=Math.sqrt(Math.abs(w.cd[0][0]*w.cd[1][1]-w.cd[0][1]*w.cd[1][0]))*3600;
 for(const kind of ["shear","pol"]){if(!$(kind==="shear"?"ovShear":"ovPol").checked||!ov[kind])continue;const L=ov[kind];
  if(lines){ctx.globalAlpha=.32;ctx.strokeStyle=L.color;ctx.lineWidth=1;for(const ln of L.streams){ctx.beginPath();ln.forEach((q,i)=>{const [x,y]=gnom(w,q[0],q[1]);const X=x*s.z+s.x,Y=y*s.z+s.y;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke()}ctx.globalAlpha=1}
  const sp=(L.meta.cell_arcsec||L.spacing||10)/arcpix;const segs=[];
  for(const c of L.cells){if((c.snr||0)<minSnr)continue;const [x,y]=gnom(w,c.ra,c.dec);const X=x*s.z+s.x,Y=y*s.z+s.y;if(X<-20||Y<-20||X>pw+20||Y>ph+20)continue;
   const a=c.amp!==undefined?c.amp:c.p,len=.5*sp*s.z*lenScale*Math.min(1,Math.max(.15,a/L.ref)),pa=c.pa*Math.PI/180;
   const [x2,y2]=gnom(w,c.ra+Math.sin(pa)/(3600*Math.cos(c.dec*Math.PI/180)),c.dec+Math.cos(pa)/3600);let vx=x2-x,vy=y2-y;const nv=Math.hypot(vx,vy)||1;vx/=nv;vy/=nv;segs.push([X-vx*len,Y-vy*len,X+vx*len,Y+vy*len])}
  ctx.lineCap="round";ctx.strokeStyle="rgba(0,0,0,.75)";ctx.lineWidth=3.6;ctx.beginPath();segs.forEach(q=>{ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3])});ctx.stroke();
  ctx.strokeStyle=L.color;ctx.lineWidth=1.9;ctx.beginPath();segs.forEach(q=>{ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3])});ctx.stroke()}}
function ovControls(){const ov=OV[DATA[cur].target];$("ovctl").hidden=!ov;if(!ov)return;const nt=[ov.shear&&ov.shear.note?"SHEAR: "+ov.shear.note:"",ov.pol&&ov.pol.note?"POLARIZATION: "+ov.pol.note:""].filter(Boolean).join("\n");if(nt)$("note").textContent=($("note").textContent?$("note").textContent+"\n\n":"")+nt;$("ovShear").parentElement.style.display=ov.shear?"":"none";$("ovPol").parentElement.style.display=ov.pol?"":"none";
 if(ov.shear)$("swS").style.background=ov.shear.color;if(ov.pol)$("swP").style.background=ov.pol.color}
["ovShear","ovPol","ovLines","ovSnr","ovLen"].forEach(id=>$(id).oninput=()=>{$("ovSnrV").textContent=$("ovSnr").value;drawOv(0);drawOv(1)});
addEventListener("resize",fit);build();drag(0);drag(1);show(0);
{const hp=new URLSearchParams(location.hash.slice(1));if(hp.get("t")){const i=DATA.findIndex(d=>d.target===hp.get("t")&&(!hp.get("k")||d.title.includes(hp.get("k"))));if(i>=0)show(i)}
 if(hp.get("shear"))$("ovShear").checked=true;if(hp.get("pol"))$("ovPol").checked=true;if(hp.get("nolines"))$("ovLines").checked=false;
 const redraw=()=>{drawOv(0);drawOv(1)};setTimeout(redraw,600);setTimeout(redraw,1500)}
</script></body></html>
